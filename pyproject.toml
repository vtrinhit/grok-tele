[project]
name = "groktele"
version = "1.0.0"
description = "Batch video generation through the @GrokKian_bot Telegram bot, with a MultiKit-compatible API"
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.36",
  "python-socks[asyncio]",
  "fastapi",
  "uvicorn[standard]",
  "pyyaml",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["groktele"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]
fast = ["cryptg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
